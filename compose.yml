services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_DB: geo_bucket
      POSTGRES_USER: geo_bucket
      POSTGRES_PASSWORD: geo_bucket
    ports: ["5456:5432"]
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_bucket -d geo_bucket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata18: