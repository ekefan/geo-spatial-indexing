[project]
name = "geo-spatial-indexing"
version = "0.1.0"
description = "Expert Listing Stage Two: Geo-spatial indexing and location normalization"
readme = "README.md"
authors = [
    { name = "Emmanuel Ebenezer", email = "ekefan.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "fastapi[standard]>=0.141.1",
    "geoalchemy2>=0.20.0",
    "h3>=4.5.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
]

[tool.uv]
package = false


[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
filterwarnings = [
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated, use anyio\.from_thread\.BlockingPortal instead\.:DeprecationWarning:starlette\.testclient',
]
markers = [
    "integration: requires a Docker daemon and starts PostgreSQL",
]


[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
]
